# Local development services only. Never used in production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ssc-postgres
    environment:
      POSTGRES_USER: ssc
      POSTGRES_PASSWORD: ssc_dev_password
      POSTGRES_DB: ssc_dev
    ports:
      - "5442:5432"
    volumes:
      - ssc-pgdata:/var/lib/postgresql/data
      - ./scripts/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssc -d ssc_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  ssc-pgdata:
