# Local development services only. Never used in production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ssc-postgres
    environment:
      POSTGRES_USER: ssc
      POSTGRES_PASSWORD: ssc_dev_password
      POSTGRES_DB: ssc_dev
    ports:
      - "5442:5432"
    volumes:
      - ssc-pgdata:/var/lib/postgresql/data
      - ./scripts/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssc -d ssc_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  # Catches every email the app sends with EMAIL_TRANSPORT=smtp and SMTP_URL=smtp://localhost:1025.
  # Read them at http://localhost:8025. Start it with: docker compose up -d mailpit
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: ssc-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  ssc-pgdata:
