name: Scheduled jobs

# Runs the site's scheduled jobs on Vercel Hobby, which only allows daily cron jobs. GitHub
# starts scheduled workflows at best every 5 minutes, sometimes later: fine here, since
# notifications are sent right after each change and the outbox job only retries.
# Needs the repository secret CRON_SECRET (the same value as in Vercel) and the variable
# SITE_URL (defaults to the production URL below).

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 7 * * *" # retention, 7:00 UTC (3:00 in Montréal in summer)
  workflow_dispatch:

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://san-sebastian-cafe.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the jobs
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set in the repository secrets; nothing to run."
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            jobs="retention"
          else
            jobs="outbox payments monitor"
          fi
          failed=0
          for job in $jobs; do
            status=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/$job" || echo "000")
            echo "$job: HTTP $status"
            if [ "$status" != "200" ]; then
              echo "::error::$job returned HTTP $status"
              failed=1
            fi
          done
          exit $failed
